<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@800&family=JetBrains+Mono:wght@600&display=swap">
<style>
html,body{margin:0;width:2400px;height:1000px;overflow:hidden}
.stage{width:2400px;height:1000px;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:linear-gradient(180deg,rgba(14,16,22,.82),rgba(14,16,22,.94)),url(../img/hero-holo.jpg) center/cover}
.top{position:absolute;top:0;left:0;right:0;height:14px;background:linear-gradient(90deg,#7fd1c9,#b9a7f0 35%,#f0c98a 70%,#7fd1c9)}
.row{display:flex;align-items:center;gap:70px}
img{width:340px;height:340px}
.word{font-family:Inter,sans-serif;font-weight:800;font-size:300px;letter-spacing:-0.02em;color:#f1efe9;line-height:1}
.word .holo{background:linear-gradient(100deg,#7fd1c9,#b9a7f0 40%,#f0c98a 70%,#7fd1c9);-webkit-background-clip:text;background-clip:text;color:transparent}
.tag{font-family:'JetBrains Mono',monospace;font-weight:600;font-size:64px;letter-spacing:.4em;color:#9aa0ad;text-transform:uppercase;margin-top:60px}
</style></head><body>
<div class="stage"><div class="top"></div>
  <div class="row"><img src="pokespa-mark.svg"><div class="word"><span class="holo">Poké</span>Spa</div></div>
  <div class="tag">Wear the shine</div>
</div>
</body></html>
