<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@800&family=JetBrains+Mono:wght@600&display=swap">
<style>
html,body{margin:0;background:transparent;width:4500px;height:5400px;overflow:hidden}
.stage{width:4500px;height:5400px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:120px}
img{width:2700px;height:2700px;display:block}
.word{font-family:Inter,sans-serif;font-weight:800;font-size:640px;letter-spacing:-0.02em;color:#f1efe9;line-height:1}
.word .holo{background:linear-gradient(100deg,#7fd1c9,#b9a7f0 40%,#f0c98a 70%,#7fd1c9);-webkit-background-clip:text;background-clip:text;color:transparent}
.tag{font-family:'JetBrains Mono',monospace;font-weight:600;font-size:120px;letter-spacing:.34em;color:#7fd1c9;text-transform:uppercase;margin-top:40px}
</style></head><body>
<div class="stage">
  <img src="pokespa-mark.svg">
  <div class="word"><span class="holo">Poké</span>Spa</div>
  <div class="tag">Restoration, disclosed. Always.</div>
</div>
</body></html>
