<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@800&family=JetBrains+Mono:wght@600&display=swap">
<style>
html,body{margin:0;width:9921px;height:5197px;overflow:hidden}
.mat{width:9921px;height:5197px;position:relative;display:flex;align-items:center;
  background:linear-gradient(180deg,rgba(10,11,14,.42),rgba(10,11,14,.60)),url(../img/silk-dark.jpg) center/cover}
.frame{position:absolute;inset:180px;border:13px solid rgba(241,239,233,.22);border-radius:124px}
.left{margin-left:700px;display:flex;align-items:center;gap:310px}
img{width:1700px;height:1700px;filter:drop-shadow(0 30px 80px rgba(0,0,0,.6))}
.stack .word{font-family:Inter,sans-serif;font-weight:800;font-size:900px;letter-spacing:-0.02em;color:#f1efe9;line-height:1}
.stack .word .holo{background:linear-gradient(100deg,#7fd1c9,#b9a7f0 40%,#f0c98a 70%,#7fd1c9);-webkit-background-clip:text;background-clip:text;color:transparent}
.stack .tag{font-family:'JetBrains Mono',monospace;font-weight:600;font-size:182px;letter-spacing:.42em;color:#bfe8e2;text-transform:uppercase;margin-top:180px}
</style></head><body>
<div class="mat"><div class="frame"></div>
  <div class="left">
    <img src="pokespa-mark.svg">
    <div class="stack">
      <div class="word"><span class="holo">Poké</span>Spa</div>
      <div class="tag">The bench. Restoration, disclosed.</div>
    </div>
  </div>
</div>
</body></html>
