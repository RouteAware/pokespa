<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@800&family=JetBrains+Mono:wght@600&display=swap">
<style>
html,body{margin:0;width:1350px;height:1350px;overflow:hidden}
.stage{width:1350px;height:1350px;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:linear-gradient(180deg,rgba(14,16,22,.80),rgba(14,16,22,.93)),url(../img/hero-holo.jpg) center/cover}
.top{position:absolute;top:0;left:0;right:0;height:12px;background:linear-gradient(90deg,#7fd1c9,#b9a7f0 35%,#f0c98a 70%,#7fd1c9)}
.frame{position:absolute;inset:40px;border:3px solid rgba(241,239,233,.22);border-radius:28px}
img{width:520px;height:520px;filter:drop-shadow(0 24px 60px rgba(0,0,0,.55))}
.word{font-family:Inter,sans-serif;font-weight:800;font-size:196px;letter-spacing:-0.02em;color:#f1efe9;line-height:1;margin-top:40px}
.word .holo{background:linear-gradient(100deg,#7fd1c9,#b9a7f0 40%,#f0c98a 70%,#7fd1c9);-webkit-background-clip:text;background-clip:text;color:transparent}
.tag{font-family:'JetBrains Mono',monospace;font-weight:600;font-size:44px;letter-spacing:.4em;color:#9aa0ad;text-transform:uppercase;margin-top:36px}
</style></head><body>
<div class="stage"><div class="top"></div><div class="frame"></div>
  <img src="pokespa-mark.svg">
  <div class="word"><span class="holo">Poké</span>Spa</div>
  <div class="tag">Wear the shine</div>
</div>
</body></html>
