<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@800&family=JetBrains+Mono:wght@600&display=swap">
<style>
html,body{margin:0;width:1200px;height:1800px;overflow:hidden}
.card{width:1200px;height:1800px;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:56px;
  background:linear-gradient(180deg,rgba(10,11,14,.42),rgba(10,11,14,.68)),url(../img/silk-glow.jpg) center/cover}
.frame{position:absolute;inset:36px;border:3px solid rgba(241,239,233,.28);border-radius:28px}
.word{font-family:Inter,sans-serif;font-weight:800;font-size:210px;letter-spacing:-0.02em;color:#f1efe9;line-height:1;
  filter:drop-shadow(0 10px 30px rgba(0,0,0,.6))}
.word .holo{background:linear-gradient(100deg,#7fd1c9,#b9a7f0 40%,#f0c98a 70%,#7fd1c9);-webkit-background-clip:text;background-clip:text;color:transparent}
.tag{font-family:'JetBrains Mono',monospace;font-weight:600;font-size:44px;letter-spacing:.42em;color:#bfe8e2;text-transform:uppercase;
  filter:drop-shadow(0 6px 18px rgba(0,0,0,.7))}
</style></head><body>
<div class="card"><div class="frame"></div>
  <div class="word"><span class="holo">Poké</span>Spa</div>
  <div class="tag">Wear the shine</div>
</div>
</body></html>
